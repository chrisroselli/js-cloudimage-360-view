<!DOCTYPE html>
<html>

<body>
  <style>
    #main-content {
    display: flex;
        justify-content: center;
    }
    canvas {
      max-width: 1500px !important;
      height: auto !important;
    }

    .cloudimage-360 {
      display: flex;
      justify-content: center;
      max-width: 1889px;
    }

    .cloudimage-360-images-carousel .cloudimage-360-carousel-image {
      min-height: auto;
    }
    .cloudimage-360-hotspot-popup {
      padding: 0;
    }
    .cloudimage-360-hotspot-link-icon::before {
      background-image: none;
    }

    .cloudimage-360 .cloudimage-360-left,
    .cloudimage-360 .cloudimage-360-right {
      padding: 8px;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      border-radius: 4px;
    }

    .cloudimage-360 .cloudimage-360-left:focus,
    .cloudimage-360 .cloudimage-360-right:focus {
      outline: none;
    }

    .cloudimage-360 .cloudimage-360-left {
      display: none;
      position: absolute;
      z-index: 100;
      top: calc(50% - 15px);
      left: 20px;
    }

    .cloudimage-360 .cloudimage-360-right {
      display: none;
      position: absolute;
      z-index: 100;
      top: calc(50% - 15px);
      right: 20px;
    }

    .cloudimage-360 .cloudimage-360-left:before,
    .cloudimage-360 .cloudimage-360-right:before {
      content: '';
      display: block;
      width: 30px;
      height: 30px;
      background: 50% 50% / cover no-repeat;
    }

    .cloudimage-360 .cloudimage-360-left:before {
      background-image: url('https://cdn.treehouseinternetgroup.com/cms_images/107/3d-house-arrow.png');
      cursor: pointer;
    }

    .cloudimage-360 .cloudimage-360-right:before {
      background-image: url('https://cdn.treehouseinternetgroup.com/cms_images/107/3d-house-arrow.png');
      transform: rotate(180deg);
      cursor: pointer;
    }

    .cloudimage-360 .cloudimage-360-left.not-active,
    .cloudimage-360 .cloudimage-360-right.not-active {
      opacity: 0.4;
      cursor: default;
    }
  </style>
  <div class="cloudimage-360" id="3d-house"
    data-folder="https://cdn.treehouseinternetgroup.com/cms_core/images/thrasher/3d-house/"
    data-filename-x="3d-house-{index}.png" data-amount-x="100" data-info="white || black" data-hide-360-logo data-hotspots data-spin-reverse>
    <button class="cloudimage-360-left"></button>
    <button class="cloudimage-360-right"></button>
  </div>


  <script src="https://cdn.treehouseinternetgroup.com/cms_core/js/thrasher/js-cloudimage-360-view.min.js"></script>
  <script src="index.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Find all elements with class 'high-energy-bills'
      var highEnergyBillsElements = document.querySelectorAll('.high-energy-bills');
      highEnergyBillsElements.forEach(function (el) {
        // Find all <a> tags inside this element
        var links = el.querySelectorAll('a');
        links.forEach(function (link) {
          var url = "https://www.gothrasher.com/3d-house/high-energy-bills.html";
          // Create iframe
          var iframe = document.createElement('iframe');
          iframe.src = url;
          iframe.width = "1000";
          iframe.height = "600";
          iframe.style.border = "none";
          // Replace the <a> with the iframe
          link.parentNode.replaceChild(iframe, link);
        });
      });
    });

    document.addEventListener("DOMContentLoaded", function () {
      // Find all elements with class 'high-energy-bills'
      var highEnergyBillsElements = document.querySelectorAll('.humid-air');
      highEnergyBillsElements.forEach(function (el) {
        // Find all <a> tags inside this element
        var links = el.querySelectorAll('a');
        links.forEach(function (link) {
          var url = "https://www.gothrasher.com/3d-house/humid-air.html";
          // Create iframe
          var iframe = document.createElement('iframe');
          iframe.src = url;
          iframe.width = "1000";
          iframe.height = "600";
          iframe.style.border = "none";
          // Replace the <a> with the iframe
          link.parentNode.replaceChild(iframe, link);
        });
      });
    });
  </script>


</body>
<!-- data-play-once -->

</html>
